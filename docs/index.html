<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>维吾尔语字体 - alkatip</title>
    <style>
        /* 引入仓库中的字体文件，预览字体效果 */
        @font-face {
            font-family: "alkatip";
            src: url("./alkatip.TTF") format("truetype");
        }
        .font-preview {
            font-family: "alkatip";
            font-size: 36px;
            margin-top: 50px;
            color: #333;
        }
    </style>
</head>
<body>
    <h1>alkatip 维吾尔语字体库</h1>
    <p>字体文件：alkatip.TTF</p>
    <p>字体预览：</p>
    <!-- 这里可以填写维吾尔语文字，测试字体显示效果 -->
    <div class="font-preview">维吾尔语字体预览示例</div>
</body>
</html>
